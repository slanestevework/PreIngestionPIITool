apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-scanner-api
  labels:
    app: pii-scanner-api
  annotations:
    haproxy.router.openshift.io/timeout: 900s
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"pii-scanner-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      deployment: pii-scanner-api
  template:
    metadata:
      labels:
        app: pii-scanner-api
        deployment: pii-scanner-api
    spec:
      containers:
      - name: api
        image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/pii-scanner-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PII_SCANNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: pii-scanner-secret
              key: api-key
        envFrom:
        - secretRef:
            name: azure-openai-credentials
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pii-scanner-api
  labels:
    app: pii-scanner-api
  annotations:
    haproxy.router.openshift.io/timeout: 900s
spec:
  selector:
    app: pii-scanner-api
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pii-scanner-api
  labels:
    app: pii-scanner-api
  annotations:
    haproxy.router.openshift.io/timeout: 900s
spec:
  to:
    kind: Service
    name: pii-scanner-api
  port:
    targetPort: http
  tls:
    termination: edge